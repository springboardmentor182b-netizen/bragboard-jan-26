services:
  db:
    image: postgres:latest
    container_name: bragboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bragboard_user
      POSTGRES_PASSWORD: bragboard_pass
      POSTGRES_DB: bragboard_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bragboard_user -d bragboard_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
