<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BragBoard Admin Portal</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#4F46E5',
                        bgLight: '#F8F9FB',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8F9FB] text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 1. LOCAL DATABASE (Mock Data) ---
        // This replaces the need for a backend server for now.
        const mockDB = {
            analytics: {
                stats: [
                    { title: "Total Shoutouts", value: "1,284" },
                    { title: "Active Comments", value: "8,432" },
                    { title: "Engagement Rate", value: "89%" }
                ],
                top_employees: [
                    { rank: 1, name: "Sarah Johnson", count: "142 shoutouts" },
                    { rank: 2, name: "Mike Chen", count: "98 shoutouts" },
                    { rank: 3, name: "Jessica Williams", count: "87 shoutouts" },
                ],
                top_categories: [
                    { rank: 1, name: "Teamwork", count: "450" },
                    { rank: 2, name: "Innovation", count: "320" },
                    { rank: 3, name: "Leadership", count: "210" },
                ]
            },
            users: [
                { id: 1, name: "Sarah Johnson", email: "sarah@company.com", dept: "Marketing", role: "employee", initial: "S", color: "bg-pink-500", joined: "Jan 10, 2024" },
                { id: 2, name: "Mike Chen", email: "mike@company.com", dept: "Engineering", role: "admin", initial: "M", color: "bg-blue-500", joined: "Feb 14, 2024" },
                { id: 3, name: "Alex Rossi", email: "alex@company.com", dept: "Sales", role: "employee", initial: "A", color: "bg-purple-500", joined: "Mar 01, 2024" },
            ],
            logs: [
                { id: 1, title: "User Login", badge: "Info", time: "10:42 AM", desc: "Admin User logged into the system.", user: "admin@company.com", ip: "192.168.1.1", type: "info" },
                { id: 2, title: "Failed Login", badge: "Warning", time: "10:30 AM", desc: "Multiple failed attempts detected.", user: "unknown", ip: "10.0.0.55", type: "warning" },
                { id: 3, title: "Profile Updated", badge: "Success", time: "09:15 AM", desc: "Sarah updated her profile picture.", user: "sarah@company.com", ip: "192.168.1.4", type: "success" }
            ]
        };

        // --- ICONS ---
        const Icons = {
            Analytics: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            Users: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Queue: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Logs: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            Logout: () => <svg width="20" height="20" fill="none" stroke="#EF4444" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Heart: () => <svg width="24" height="24" fill="none" stroke="#EF4444" strokeWidth="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            Comment: () => <svg width="24" height="24" fill="none" stroke="#8B5CF6" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>,
            Trend: () => <svg width="24" height="24" fill="none" stroke="#10B981" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            Bell: () => <svg width="20" height="20" fill="none" stroke="#6B7280" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
            Edit: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Trash: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Search: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Logo: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><path d="M12 15l-2 5l2-2l2 2l-2-5" /><circle cx="12" cy="9" r="7" /></svg>,
            Download: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Filter: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            CheckCircle: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            AlertTriangle: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            AlertCircle: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Info: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        };

        // --- SIDEBAR ---
        const Sidebar = ({ activePage, onNavigate }) => {
            const MenuItem = ({ id, label, icon: Icon }) => (
                <div onClick={() => onNavigate(id)} className={`flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer transition-colors ${activePage === id ? 'bg-[#4F46E5] text-white shadow-sm' : 'text-gray-600 hover:bg-gray-50'}`}>
                    <Icon />
                    <span className="font-medium text-sm">{label}</span>
                </div>
            );
            return (
                <div className="w-64 bg-white h-screen fixed left-0 top-0 border-r border-gray-200 flex flex-col z-50">
                    <div className="p-6 flex items-center gap-3">
                        <div className="w-8 h-8 bg-[#4F46E5] rounded-lg flex items-center justify-center"><Icons.Logo /></div>
                        <div><div className="font-bold text-gray-900 leading-tight">BragBoard</div><div className="text-xs text-gray-500">Admin Portal</div></div>
                    </div>
                    <div className="flex-1 px-3 space-y-1 mt-2">
                        {/* CHANGED: Renamed ID and Label to 'Dashboard' */}
                        <MenuItem id="dashboard" label="Dashboard" icon={Icons.Analytics} />
                        <MenuItem id="users" label="User Management" icon={Icons.Users} />
                        <MenuItem id="queue" label="Moderation Queue" icon={Icons.Queue} />
                        <MenuItem id="logs" label="System Logs" icon={Icons.Logs} />
                    </div>
                    <div className="p-4 border-t border-gray-100">
                        <div className="flex items-center gap-3 px-4 py-2 text-red-500 cursor-pointer hover:bg-red-50 rounded-lg transition-colors"><Icons.Logout /><span className="font-medium text-sm">Logout</span></div>
                    </div>
                </div>
            );
        };

        // --- HEADER ---
        const Header = ({ title }) => {
            const [showNotifications, setShowNotifications] = useState(false);
            const notifications = [
                { id: 1, text: "Mike Chen liked your shoutout", time: "2 min ago", new: true },
                { id: 2, text: "Sarah Johnson posted a new shoutout", time: "1 hour ago", new: true },
            ];
            return (
                <div className="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 sticky top-0 z-40">
                    <div>
                        <h1 className="text-xl font-bold text-gray-900 capitalize">{title.replace('-', ' ')}</h1>
                        <p className="text-sm text-gray-500">Manage your team's recognition platform</p>
                    </div>
                    <div className="flex items-center gap-6">
                        <div className="relative">
                            <button onClick={() => setShowNotifications(!showNotifications)} className="relative p-1 rounded-full hover:bg-gray-100 transition-colors focus:outline-none">
                                <Icons.Bell />
                                <div className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border border-white"></div>
                            </button>
                            {showNotifications && (
                                <div className="absolute right-0 mt-3 w-80 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
                                    <div className="px-4 py-2 border-b border-gray-50 flex justify-between items-center"><h3 className="font-bold text-sm text-gray-800">Notifications</h3></div>
                                    <div className="max-h-64 overflow-y-auto">
                                        {notifications.map(notif => (
                                            <div key={notif.id} className={`px-4 py-3 hover:bg-gray-50 cursor-pointer border-b border-gray-50 last:border-0 ${notif.new ? 'bg-blue-50/30' : ''}`}>
                                                <p className="text-sm text-gray-700 leading-snug">{notif.text}</p>
                                                <p className="text-xs text-gray-400 mt-1">{notif.time}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="flex items-center gap-3 pl-6 border-l border-gray-200">
                            <div className="w-10 h-10 bg-[#4F46E5] rounded-full flex items-center justify-center text-white font-medium text-sm">AU</div>
                            <div className="text-right">
                                <div className="text-sm font-bold text-gray-900">Admin User</div>
                                <div className="inline-flex bg-[#4F46E5] text-white text-[10px] px-2 py-0.5 rounded-full">Admin</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- PAGE: DASHBOARD (WAS ANALYTICS) ---
        const DashboardPage = () => {
            const [data, setData] = useState(null);

            useEffect(() => {
                // SIMULATED DATABASE FETCH
                // Instead of fetch(), we just use the local mockDB
                setTimeout(() => {
                    setData(mockDB.analytics); 
                }, 500); // Small delay to simulate "loading" feeling
            }, []);

            if (!data) return <div className="p-10 text-center text-gray-500">Loading Dashboard...</div>;

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-3 gap-6">
                        {data.stats.map((stat, i) => (
                            <div key={i} className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
                                <div><div className="text-sm text-gray-500 mb-1">{stat.title}</div><div className="text-3xl font-bold text-gray-900">{stat.value}</div></div>
                                <div className={`p-3 rounded-xl ${i===0?'bg-red-50 text-red-500':i===1?'bg-purple-50 text-purple-500':'bg-emerald-50 text-emerald-500'}`}>
                                    {i===0 ? <Icons.Heart /> : i===1 ? <Icons.Comment /> : <Icons.Trend />}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-8 space-y-10">
                        <div>
                            <h3 className="font-bold text-gray-800 mb-6 flex items-center gap-2 text-sm">
                                <svg width="20" height="20" fill="none" stroke="#10B981" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg> Top Recognized Employees
                            </h3>
                            <div className="space-y-4">
                                {data.top_employees.map((item) => (
                                    <div key={item.rank} className="flex items-center justify-between border-b border-gray-50 pb-3 last:border-0 last:pb-0">
                                        <div className="flex items-center gap-4">
                                            <div className="w-8 h-8 rounded-full bg-[#3B82F6] text-white flex items-center justify-center font-bold text-sm">{item.rank}</div>
                                            <span className="font-medium text-gray-700 text-sm">{item.name}</span>
                                        </div>
                                        <span className="text-xs text-gray-500 font-medium">{item.count}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div>
                            <h3 className="font-bold text-gray-800 mb-6 flex items-center gap-2 text-sm">
                                <svg width="20" height="20" fill="none" stroke="#6366F1" strokeWidth="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Top Categories
                            </h3>
                            <div className="space-y-4">
                                {data.top_categories.map((item) => (
                                    <div key={item.rank} className="flex items-center justify-between border-b border-gray-50 pb-3 last:border-0 last:pb-0">
                                        <div className="flex items-center gap-4">
                                            <div className="w-8 h-8 rounded-full bg-[#F3E8FF] text-[#9333EA] flex items-center justify-center font-bold text-sm">{item.rank}</div>
                                            <span className="font-medium text-gray-700 text-sm">{item.name}</span>
                                        </div>
                                        <span className="text-xs text-gray-500 font-medium">{item.count}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- PAGE: USER MANAGEMENT ---
        const UserManagementPage = () => {
            const [users, setUsers] = useState([]);

            useEffect(() => {
                // SIMULATED DATABASE FETCH
                setUsers(mockDB.users);
            }, []);

            return (
                <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div className="p-4 border-b border-gray-100 flex items-center justify-between">
                        <div className="flex items-center gap-2"><h3 className="font-bold text-gray-700">All Users</h3><span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium">{users.length}</span></div>
                        <div className="relative"><span className="absolute left-3 top-2.5 text-gray-400"><Icons.Search /></span><input type="text" placeholder="Search users..." className="pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary w-64" /></div>
                    </div>
                    <table className="w-full text-left">
                        <thead className="bg-gray-50 text-gray-500 text-xs uppercase font-semibold"><tr><th className="px-6 py-4">User</th><th className="px-6 py-4">Email</th><th className="px-6 py-4">Department</th><th className="px-6 py-4">Role</th><th className="px-6 py-4">Status</th><th className="px-6 py-4">Joined</th><th className="px-6 py-4 text-right">Actions</th></tr></thead>
                        <tbody className="divide-y divide-gray-100">{users.map((u) => (<tr key={u.id} className="hover:bg-gray-50"><td className="px-6 py-4"><div className="flex items-center gap-3"><div className={`w-9 h-9 rounded-full ${u.color} text-white flex items-center justify-center font-bold text-xs`}>{u.initial}</div><span className="font-medium text-gray-900 text-sm">{u.name}</span></div></td><td className="px-6 py-4 text-sm text-gray-600">{u.email}</td><td className="px-6 py-4 text-sm text-gray-600">{u.dept}</td><td className="px-6 py-4"><span className={`px-2.5 py-1 rounded-full text-xs font-medium border flex w-fit items-center gap-1 ${u.role === 'admin' ? 'bg-[#EEF2FF] text-[#4F46E5] border-[#E0E7FF]' : 'bg-gray-50 text-gray-600 border-gray-200'}`}><span className="capitalize">{u.role}</span></span></td><td className="px-6 py-4"><span className="px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-100">active</span></td><td className="px-6 py-4 text-sm text-gray-500">{u.joined}</td><td className="px-6 py-4 text-right"><div className="flex justify-end gap-2"><button className="text-gray-400 hover:text-[#4F46E5]"><Icons.Edit /></button><button className="text-gray-400 hover:text-red-500"><Icons.Trash /></button></div></td></tr>))}</tbody>
                    </table>
                </div>
            );
        };

        // --- PAGE: SYSTEM LOGS ---
        const LogsPage = () => {
            const [logs, setLogs] = useState([]);

            useEffect(() => {
                // SIMULATED DATABASE FETCH
                setLogs(mockDB.logs);
            }, []);

            const getTypeStyles = (type) => {
                switch(type) {
                    case 'success': return { iconBg: 'bg-emerald-50 text-emerald-600', badge: 'bg-[#4F46E5] text-white', icon: Icons.CheckCircle };
                    case 'warning': return { iconBg: 'bg-amber-50 text-amber-600', badge: 'bg-amber-100 text-amber-800', icon: Icons.AlertTriangle };
                    case 'info': return { iconBg: 'bg-blue-50 text-blue-600', badge: 'bg-[#4F46E5] text-white', icon: Icons.Info };
                    case 'error': return { iconBg: 'bg-red-50 text-red-600', badge: 'bg-red-100 text-red-800', icon: Icons.AlertCircle };
                    default: return { iconBg: 'bg-gray-50', badge: 'bg-gray-100', icon: Icons.Info };
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-start">
                        <div><h3 className="text-sm text-gray-500">Monitor system activities and user actions</h3></div>
                        <button className="flex items-center gap-2 bg-white border border-gray-200 px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 shadow-sm transition-colors"><Icons.Download /> Export Logs</button>
                    </div>
                    <div className="grid grid-cols-4 gap-4">
                        <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between"><div><div className="text-xs text-gray-500 font-medium uppercase mb-1">Total Logs</div><div className="text-2xl font-bold text-gray-900">{logs.length}</div></div><div className="text-gray-400 p-2 bg-gray-50 rounded-lg"><Icons.Logs /></div></div>
                        <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between"><div><div className="text-xs text-gray-500 font-medium uppercase mb-1">Errors</div><div className="text-2xl font-bold text-red-600">0</div></div><div className="text-red-500 p-2 bg-red-50 rounded-lg"><Icons.AlertCircle /></div></div>
                        <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between"><div><div className="text-xs text-gray-500 font-medium uppercase mb-1">Warnings</div><div className="text-2xl font-bold text-amber-500">1</div></div><div className="text-amber-500 p-2 bg-amber-50 rounded-lg"><Icons.AlertTriangle /></div></div>
                        <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between"><div><div className="text-xs text-gray-500 font-medium uppercase mb-1">Success</div><div className="text-2xl font-bold text-emerald-500">2</div></div><div className="text-emerald-500 p-2 bg-emerald-50 rounded-lg"><Icons.CheckCircle /></div></div>
                    </div>
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                        <div className="flex justify-between items-center mb-6">
                            <div className="relative flex-1 max-w-lg"><span className="absolute left-3 top-2.5 text-gray-400"><Icons.Search /></span><input type="text" placeholder="Search logs by action, user, or details..." className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary bg-transparent" /></div>
                            <div className="flex items-center gap-3"><button className="p-2 text-gray-400 hover:text-gray-600"><Icons.Filter /></button><button className="flex items-center gap-2 text-sm font-medium text-gray-700">All Types <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6"/></svg></button></div>
                        </div>
                        <div className="space-y-4">
                            {logs.map(log => {
                                const styles = getTypeStyles(log.type);
                                const IconComponent = styles.icon;
                                return (
                                    <div key={log.id} className="border border-gray-100 rounded-xl p-4 flex gap-4 hover:bg-gray-50 transition-colors">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${styles.iconBg}`}><IconComponent /></div>
                                        <div className="flex-1">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-center gap-2 mb-1"><span className="font-bold text-gray-900 text-sm">{log.title}</span><span className={`text-[10px] px-1.5 py-0.5 rounded font-bold uppercase tracking-wider ${log.badge === 'Info' || log.badge === 'Success' ? 'bg-[#4F46E5] text-white' : styles.badge}`}>{log.badge}</span></div>
                                                <span className="text-xs text-gray-400 font-mono">{log.time}</span>
                                            </div>
                                            <p className="text-sm text-gray-600 mb-2">{log.desc}</p>
                                            <div className="flex gap-4 text-xs text-gray-500"><span><span className="font-semibold text-gray-700">User:</span> {log.user}</span><span><span className="font-semibold text-gray-700">IP:</span> {log.ip}</span></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const ModerationPage = () => <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-8 text-center"><div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400"><Icons.Queue /></div><h3 className="text-lg font-bold text-gray-900">Moderation Queue is Empty</h3><p className="text-gray-500 text-sm mt-2">Great job! There are no flagged shoutouts to review right now.</p></div>;

        // --- APP SHELL ---
        const App = () => {
            // CHANGED: Default page is now 'dashboard' (matches the new ID in sidebar)
            const [activePage, setActivePage] = useState('dashboard');
            
            const renderContent = () => {
                switch(activePage) {
                    case 'dashboard': return <DashboardPage />;
                    case 'users': return <UserManagementPage />;
                    case 'queue': return <ModerationPage />;
                    case 'logs': return <LogsPage />;
                    default: return <DashboardPage />;
                }
            };
            return (
                <div className="min-h-screen bg-[#F8F9FB]">
                    <Sidebar activePage={activePage} onNavigate={setActivePage} />
                    <div className="ml-64 flex flex-col min-h-screen">
                        <Header title={activePage} />
                        <main className="p-8 flex-1">{renderContent()}</main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
