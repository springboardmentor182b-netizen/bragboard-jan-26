name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Build & deploy backend ────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/bragboard
            echo "==> Pulling latest code..."
            git pull origin main
            echo "==> Rebuilding and restarting FastAPI container..."
            docker compose -f docker-compose.prod.yml up -d --build
            echo "==> Backend deployed ✅"
            docker ps --filter name=bragboard_server

  # ── Job 2: Build frontend & deploy to Nginx ───────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend   # Wait for backend to be up first
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build React app
        working-directory: client
        run: npm run build
        env:
          # Using relative /api path — no VITE_API_URL needed (Nginx handles routing)
          NODE_ENV: production

      - name: Copy build to EC2 and reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /var/www/bragboard
            echo "==> Frontend files will be synced from GitHub runner..."

      - name: Sync frontend build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "client/dist/*"
          target: "/tmp/bragboard-dist"
          strip_components: 1

      - name: Move files and reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /var/www/bragboard
            sudo rsync -a --delete /tmp/bragboard-dist/dist/ /var/www/bragboard/
            rm -rf /tmp/bragboard-dist
            sudo nginx -t && sudo systemctl reload nginx
            echo "==> Frontend deployed ✅"
