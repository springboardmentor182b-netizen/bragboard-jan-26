server {
    listen 80;
    # Replace with your EC2 public IP or domain name
    server_name _;

    # ── Frontend: serve React build ──────────────────────────────────────────
    root /var/www/bragboard;
    index index.html;

    location / {
        # SPA fallback — all unknown paths serve index.html (React Router handles routing)
        try_files $uri $uri/ /index.html;
    }

    # ── Backend: proxy /api/* to FastAPI ─────────────────────────────────────
    location /api/ {
        # Strip /api prefix while proxying to FastAPI
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Uploads: serve files from the uploads volume ──────────────────────────
    location /uploads/ {
        alias /home/ubuntu/bragboard/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Max upload size (match FastAPI) ──────────────────────────────────────
    client_max_body_size 10M;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
